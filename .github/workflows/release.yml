name: Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # アクションは供給連鎖対策でコミットSHAに固定する(コメントは参照用の版)。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: extension
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kota-zo/myspoti
          ref: 5b8754d5eeeb5755aa7095744239910ffc2de8db
          path: sdk
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check translations (i18n.json ↔ main.js ↔ manifest.json)
        run: node extension/scripts/check-i18n.js
      - name: Check with upstream SDK
        working-directory: sdk/base
        run: |
          ./gradlew :extensions-cli:run --args="check $GITHUB_WORKSPACE/extension"
          ./gradlew :extensions-cli:run --args="run $GITHUB_WORKSPACE/extension download-source --title MissingMetadata"
      - name: Build standard package
        run: node extension/scripts/pack.js extension.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension
          path: extension.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches manifest.json
        run: |
          node -e "const manifest = require('./manifest.json'); if ('v' + manifest.version !== process.env.GITHUB_REF_NAME) process.exit(1);"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" extension.zip --title "$GITHUB_REF_NAME" --verify-tag --latest
